[workspace]
resolver = "3"
members = ["cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
publish = false

[profile.release]
codegen-units = 1
lto = true
strip = true
# Size over speed: every run is a short configuration step or one HTTPS download.
opt-level = "z"
panic = "abort"
