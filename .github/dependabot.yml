version: 2

# Minor and patch updates arrive grouped; every major update gets its own pull request so a
# breaking change is reviewed (and tested by CI) on its own.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
