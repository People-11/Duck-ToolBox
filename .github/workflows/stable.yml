name: Stable

on:
  # A stable version bump on main is an explicit release request.
  push:
    branches: [main]
    paths:
      - module/module.prop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    with:
      stable: true
    secrets: inherit
